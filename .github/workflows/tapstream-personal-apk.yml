name: TapStream personal Android APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tapstream-personal-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore TapStream source
        env:
          TAPSTREAM_GZIP_B64: 
        run: |
          mkdir -p tapstream-app
          cd tapstream-app
          printf '%s' "$TAPSTREAM_GZIP_B64" | base64 --decode > source.tar.gz
          echo "cf04218fb532931d7eb968c29f02b42be3c9d0b79f09228121b69612946c333a  source.tar.gz" | sha256sum -c
          tar -xzf source.tar.gz
          rm source.tar.gz
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check seek tests
        working-directory: tapstream-app
        run: node tests/seek.test.js
      - name: Build debug APK
        working-directory: tapstream-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TapStream-APK
          path: tapstream-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
